   <rect x="2" y="2" width="116" height="116" rx="20" fill="none" stroke="#14b8a6" stroke-width="2" stroke-dasharray="7 6" />
   <g fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
