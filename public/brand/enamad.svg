<!--
  PLACEHOLDER — not a real trust seal.

  An Enamad (نماد اعتماد الکترونیکی) seal is a legal guarantee document issued
  to one specific domain, so it cannot be borrowed from another site. Replace
  this file with the seal Enamad issues for this domain, then update the `id`
  and `Code` in BADGES below and point `src` at the official logo endpoint:

    https://trustseal.enamad.ir/logo.aspx?id=<YOUR_ID>&Code=<YOUR_CODE>
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="نماد اعتماد الکترونیکی">
